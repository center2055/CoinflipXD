name: CoinflipXD
main: io.github.center2055.coinflipxd.CoinFlipPlugin
version: '${version}'
api-version: '1.21'
folia-supported: true
author: center2055
website: https://modrinth.com/plugin/coinflipxd
description: Coinflip wagering with Vault economy, a GUI and Bedrock (Floodgate) forms.
depend:
  - Vault
softdepend:
  - Floodgate
commands:
  cf:
    description: CoinflipXD commands
    aliases: [coinflip]
    usage: |-
      /<command> - open the coinflip browser
      /<command> <amount> - create a public coinflip
      /<command> <player> <amount> - challenge a player
      /<command> <player> accept|deny - answer a challenge
      /<command> cancel - cancel your coinflip
      /<command> stats [player] - view stats
      /<command> reload - reload config (admin)
    permission: coinflip.use
permissions:
  coinflip.use:
    description: Create and accept public coinflips and open the GUI
    default: true
  coinflip.private:
    description: Challenge a specific player
    default: false
  coinflip.bypass.minmax:
    description: Ignore the min/max bet and the balance-percent limit
    default: false
  coinflip.admin:
    description: Reload the config and cancel other players' coinflips
    default: op
  coinflip.notify:
    description: Get staff notifications when a payout or refund fails
    default: op

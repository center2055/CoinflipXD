plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'io.github.center2055'
version = '1.3.0'

// Compiled against Paper 1.21.1 so one jar runs on 1.21 through 26.x (Java 21 bytecode).
// Check against newer APIs with:  ./gradlew compileJava -PapiTarget=paper   (or spigot26)
def apiTarget = (findProperty('apiTarget') ?: 'oldest').toString()

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.MilkBowl' }
    }
}

dependencies {
    switch (apiTarget) {
        case 'paper':
            compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'
            break
        case 'spigot26':
            compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
            break
        default:
            compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    }
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') { transitive = false }

    // Bundled for Spigot/Bukkit, which have no native Adventure. Paper uses its own copy and ignores these.
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = apiTarget == 'oldest' ? 21 : 25
    options.compilerArgs.addAll(['-Xlint:all,-processing,-serial,-options,-classfile,-deprecation,-removal'])
}

def pluginVersion = project.version.toString()

processResources {
    inputs.property 'version', pluginVersion
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

shadowJar {
    archiveBaseName = 'CoinflipXD'
    archiveClassifier = ''
    // The server already provides these.
    dependencies {
        exclude(dependency('com.google.code.gson:gson'))
        exclude(dependency('com.google.errorprone:.*'))
        exclude(dependency('org.jetbrains:annotations'))
        exclude(dependency('org.jspecify:jspecify'))
    }
    exclude 'META-INF/maven/**', 'META-INF/versions/**/module-info.class', 'module-info.class'
}

jar {
    // Only the shaded jar is meant for servers.
    archiveClassifier = 'plain'
}

build {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
}
